[tool.uv.workspace]
members = ["libs/cartly-domain", "libs/cartly-infra"]

[tool.uv.sources]
cartly-domain = { workspace = true }
cartly-infra = { workspace = true }

[project]
name = "cartly"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "cartly-domain",
    "cartly-infra",
    "fastapi[standard]>=0.128.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
]

[dependency-groups]
dev = [
    "commitizen>=4.13.6",
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
    "ty>=0.0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv_build]
source-dir = "src"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"
