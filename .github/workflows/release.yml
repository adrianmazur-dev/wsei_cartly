name: release

on:
  workflow_dispatch:
  push:
    branches: [development]

permissions:
  contents: write
  packages: write

jobs:
  release-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7.3.0
        with:
          enable-cache: true

      - name: Install commitizen
        run: uv tool install commitizen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version (Local)
        id: bump
        run: |
          if cz bump --yes --changelog; then
            VERSION="v$(cz version --project)"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr.io
        if: steps.bump.outputs.bumped == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.bump.outputs.bumped == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        if: steps.bump.outputs.bumped == 'true'
        run: |
          # Backend
          docker buildx build ./backend \
            --file ./backend/Dockerfile \
            --push \
            --tag ghcr.io/${{ github.repository }}/backend:${{ steps.bump.outputs.version }} \
            --tag ghcr.io/${{ github.repository }}/backend:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max

          # Frontend
          docker buildx build ./frontend \
            --file ./frontend/Dockerfile \
            --push \
            --tag ghcr.io/${{ github.repository }}/frontend:${{ steps.bump.outputs.version }} \
            --tag ghcr.io/${{ github.repository }}/frontend:latest \
            --cache-from type=gha \
            --cache-to type=gha,mode=max

      - name: Push Git changes
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git push
          git push --tags

      - name: Deploy to Coolify
        if: steps.bump.outputs.bumped == 'true'
        run: |
          curl --request GET '${{ secrets.COOLIFY_WEBHOOK }}' \
               --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'